# Secret Discipline Enforcement
#
# CI gates for HR-3 (no Debug on secrets), HR-4 (no memcmp on secrets),
# and HR-5 (no secret material in logs).
#
# See specs/HOW_SECRET_IS_SECURED_BY_SOFTWARE_SPEC.md for full requirements.

name: Secret Discipline

on:
  push:
    branches:
      - alpha
      - mvp
  pull_request:
    branches:
      - alpha
      - mvp

permissions:
  contents: read

jobs:
  ############################
  # HR-3: Debug-derive scan
  # REQ-Z8.1
  ############################
  hr3-debug-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HR-3 — No Debug derive on secret-holding types
        run: |
          if grep -rnE '#\[derive\([^)]*Debug[^)]*\)\]' \
               --include='*.rs' \
               p2p/core-engine/src p2p/foretias-client/src p2p/foretias-server/src \
            | grep -iE '(Secret|Priv|Seed|Share|Nonce)([^a-zA-Z]|$)' ; then
            echo "::error::HR-3 violation: Debug derive found on secret-holding type"
            exit 1
          fi
          echo "HR-3 scan passed: no Debug derives on secret types"

  ############################
  # HR-4: memcmp scan
  # REQ-Z8.2
  ############################
  hr4-memcmp-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HR-4 — No bare memcmp in C11 core
        run: |
          if grep -nE '\bmemcmp\(' p2p/core/src/*.c 2>/dev/null; then
            echo "::error::HR-4 violation: bare memcmp found in C11 core; use sodium_memcmp"
            exit 1
          fi
          echo "HR-4 scan passed: no bare memcmp in core"

  ############################
  # HR-3: Negative compile test
  # REQ-Z8.4 — secret_no_debug test
  ############################
  hr3-compile-test:
    runs-on: ubuntu-latest
    needs: hr3-debug-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libsodium-dev libssl-dev

      - name: Build C11 core (required for bindgen)
        working-directory: p2p/core
        run: make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "p2p -> p2p/target"

      - name: Run secret_no_debug test (REQ-Z8.4)
        working-directory: p2p
        run: cargo test -p foretias-core --test secret_no_debug -- --nocapture

  ############################
  # REQ-Z8.5: CLI hex leak test
  # Blocks PRs if secrets leak to stdout/stderr
  ############################
  hr5-cli-leak-test:
    runs-on: ubuntu-latest
    needs: hr3-compile-test
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libsodium-dev libssl-dev

      - name: Build C11 core
        working-directory: p2p/core
        run: make

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "p2p -> p2p/target"

      - name: Build foretias binary (debug mode is sufficient for leak test)
        working-directory: p2p
        run: cargo build -p foretias-server

      - name: Run CLI hex leak test (REQ-Z8.5)
        working-directory: p2p
        run: cargo test -p foretias-server --test cli_no_hex_leak -- --nocapture
