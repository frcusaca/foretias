[package]
name    = "foretias-core"
version = "0.3.0"
edition = "2021"

[lib]
name        = "foretias_core"
crate-type  = ["rlib", "staticlib"]

[features]
default     = ["software-crypto"]
software-crypto = []

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2          = "0.10"
blake3        = "1"
hmac          = "0.12"
hkdf          = "0.12"
chacha20poly1305 = "0.10"
rand          = "0.8"
rand_core     = "0.6"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_cbor   = "0.11"
postcard     = { version = "1", features = ["alloc"] }
bincode      = "1"
base64       = "0.21"


thiserror           = "2"
tracing             = "0.1"
tracing-subscriber  = "0.3"
once_cell           = "1"
parking_lot         = "0.12"
uuid                = { version = "1", features = ["v4", "serde"] }
hex                 = "0.4"
zeroize             = "1"
tokio               = { version = "1", features = ["full"] }
oqs                 = { version = "0.11", default-features = false, features = ["sphincs", "dilithium", "ml_dsa", "ml_kem", "vendored"] }
argon2              = "0.5"
[dev-dependencies]
static_assertions = "1.1"
syn               = { version = "2.0", features = ["full", "visit", "parsing"] }
rustdoc-types     = "0.57"

[build-dependencies]
cc      = "1.0"
bindgen = "0.70"
cmake   = "0.1"


