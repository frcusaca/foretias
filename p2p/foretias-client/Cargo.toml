[package]
name    = "foretias-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "foretias_client"

[dependencies]
foretias-core = { version = "0.3", path = "../core-engine" }
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
parking_lot   = "0.12"
hex           = "0.4"
thiserror     = "2"
tracing       = "0.1"

[dev-dependencies]
serde_json = "1"
