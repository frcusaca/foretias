[package]
name    = "foretias-node"
version = "0.4.0"
edition = "2021"

[lib]
name = "foretias_node"

[[bin]]
name = "foretias"
path = "src/main.rs"

[dependencies]
foretias-core = { version = "0.3", path = "../core-engine" }

tokio        = { version = "1", features = ["full"] }
clap         = { version = "4", features = ["derive"] }
tokio-util   = { version = "0.7", features = ["codec"] }
futures      = "0.3"
async-trait  = "0.1"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

thiserror           = "2"
tracing             = "0.1"
tracing-subscriber  = "0.3"
parking_lot         = "0.12"
uuid                = { version = "1", features = ["v4", "serde"] }
hex                 = "0.4"
zeroize             = "1"
rand                = "0.8"
serde_cbor          = "0.11"
base64              = "0.21"

libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "tcp", "noise", "yamux", "identify", "ping", "macros", "ed25519", "kad", "gossipsub",
]}
multiaddr = "0.18"
axum = "0.8.9"

[dev-dependencies]
serde_json = "1"

