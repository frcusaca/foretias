[package]
name    = "foretias-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "foretias_server"

[[bin]]
name = "foretias"
path = "src/main.rs"

[dependencies]
foretias-core = { version = "0.3", path = "../core-engine" }
foretias-client = { version = "0.1", path = "../foretias-client" }

tokio        = { version = "1", features = ["full"] }
clap         = { version = "4", features = ["derive"] }
tokio-util   = { version = "0.7", features = ["codec"] }
futures      = "0.3"
async-trait  = "0.1"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

thiserror           = "2"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender    = "0.2"
parking_lot         = "0.12"
uuid                = { version = "1", features = ["v4", "serde"] }
hex                 = "0.4"
zeroize             = "1"
rand                = "0.8"
serde_cbor          = "0.11"
base64              = "0.21"

chrono         = "0.4"
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "tcp", "noise", "yamux", "identify", "ping", "macros", "ed25519", "kad", "gossipsub", "request-response",
]}
multiaddr = "0.18"
axum = "0.8.9"

delegate     = "0.8"

[dev-dependencies]
serde_json = "1"
insta      = "1"

