[package]
name    = "fortias-node"
version = "0.1.0"
edition = "2021"

[lib]
name = "fortias_node"

[[bin]]
name = "fortias"
path = "src/main.rs"

[dependencies]
fortias-core = { path = "../core-engine" }

tokio        = { version = "1", features = ["full"] }
clap         = { version = "4", features = ["derive"] }
tokio-util   = { version = "0.7", features = ["codec"] }
futures      = "0.3"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

thiserror           = "2"
tracing             = "0.1"
tracing-subscriber  = "0.3"
parking_lot         = "0.12"
uuid                = { version = "1", features = ["v4", "serde"] }
hex                 = "0.4"
zeroize             = "1"

[dev-dependencies]
serde_json = "1"

