[package]
name    = "fortias-python"
version = "0.1.0"
edition = "2021"

[lib]
name        = "fortias_p2p"
crate-type  = ["cdylib"]

[dependencies]
fortias-core = { path = "../core-engine" }
fortias-node = { path = "../fortias-node" }

pyo3         = { version = "0.21", features = ["extension-module", "abi3-py37"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
parking_lot  = "0.12"
