[package]
name    = "fortias_p2p"
version = "0.1.0"
edition = "2021"

[lib]
name        = "fortias_p2p"
crate-type  = ["cdylib", "rlib", "staticlib"]

[features]
default     = ["python", "software-crypto"]
python      = ["dep:pyo3"]
go          = []
software-crypto = []

[[bin]]
name = "fortias"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
clap         = { version = "4", features = ["derive"] }
tokio-util   = { version = "0.7", features = ["codec"] }
futures      = "0.3"

ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2          = "0.10"
blake3        = "1"
hmac          = "0.12"
chacha20poly1305 = "0.10"
rand          = "0.8"
rand_core     = "0.6"

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

pyo3         = { version = "0.21", features = ["extension-module", "abi3-py37"], optional = true }

thiserror           = "2"
tracing             = "0.1"
tracing-subscriber  = "0.3"
once_cell           = "1"
parking_lot         = "0.12"
uuid                = { version = "1", features = ["v4", "serde"] }
hex                 = "0.4"
zeroize             = "1"

[build-dependencies]
cc      = "1.0"
bindgen = "0.70"

[profile.release]
opt-level = 3
lto       = true
strip     = true

[profile.dev]
# Speed up by having more parallel units (default is 16)
codegen-units = 256 
# Disable debug symbols if you aren't using a visual debugger (LLDB/GDB)
debug = 0 
# No optimization
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
