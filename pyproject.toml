[project]
name = "fortias"
description = "Free, Open-source and Resilient Time Integrity Attestation Service"
readme = "README.md"
license = { text = "BSD 3-Clause Clear License" }
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/frcusaca/fortias"
Repository = "https://github.com/frcusaca/fortias"
Changelog = "https://github.com/frcusaca/fortias/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback = "0.0.1"
exclude = ["alpha"]

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-tag"
style = "semver"

[tool.hatch.build.hooks.vcs]
