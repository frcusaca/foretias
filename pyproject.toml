[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foretias"
version = "0.2.0"
description = "Free, Open-source and Resilient Time Integrity Attestation Service"
readme = "README.md"
license = { text = "BSD 3-Clause Clear License" }
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["foretias-p2p>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
foretis = "foretias.cli:main"

[project.urls]
Homepage = "https://github.com/frcusaca/foretias"
Repository = "https://github.com/frcusaca/foretias"
