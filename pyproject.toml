[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fortias"
dynamic = ["version"]
description = "Free, Open-source and Resilient Time Integrity Attestation Service"
readme = "README.md"
license = { text = "BSD 3-Clause Clear License" }
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fortis = "fortias.cli:main"

[project.urls]
Homepage = "https://github.com/frcusaca/fortias"
Repository = "https://github.com/frcusaca/fortias"

[tool.maturin]
manifest-path = "p2p/fortias-python/Cargo.toml"
module-name = "fortias_p2p"
